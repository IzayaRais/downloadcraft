<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IDM Popup — Compact Blue</title>
<style>
  body { background: #0a0a1a; color: #e0e0f0; font-family: 'Segoe UI', sans-serif; padding: 40px; }
  h1 { text-align: center; font-size: 20px; margin-bottom: 4px; color: #fff; }
  .subtitle { text-align: center; color: #8888a8; margin-bottom: 28px; font-size: 11px; }
  .popup-wrap { display: flex; justify-content: center; }
</style>
</head>
<body>

<h1>IDM Download Popup</h1>
<p class="subtitle">Matching your screenshot layout</p>

<div class="popup-wrap">
  <div style="width:560px;background:#0f0f22;border:1px solid #1e293b;border-radius:8px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.6);">

    <!-- Title Bar -->
    <div style="display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #1e293b;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#3b82f6" stroke-width="2"/><path d="M12 8v8M8.5 11.5L12 15l3.5-3.5" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="font-size:13px;font-weight:500;color:#e2e8f0;">Add download</span>
      <span style="margin-left:auto;display:flex;gap:16px;align-items:center;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 12h14" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><rect x="5" y="5" width="14" height="14" rx="1" stroke="#94a3b8" stroke-width="2"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
    </div>

    <!-- Content -->
    <div style="padding:14px 16px;">

      <!-- URL -->
      <div style="display:flex;align-items:center;background:#1e293b;border:1px solid #334155;border-radius:6px;height:36px;padding:0 4px 0 12px;margin-bottom:10px;">
        <span style="flex:1;font-size:11px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">https://download-installer.cdn.mozilla.net/pub/firefox/releases/129.0.2/</span>
        <div style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="12" height="12" rx="2" stroke="#94a3b8" stroke-width="1.5"/><path d="M4 16V4h12" stroke="#94a3b8" stroke-width="1.5"/></svg>
        </div>
      </div>

      <!-- Save Path + File Size -->
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <div style="flex:1;display:flex;align-items:center;background:#1e293b;border:1px solid #334155;border-radius:6px;height:36px;padding:0 4px 0 12px;">
          <span style="flex:1;font-size:11px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">C:\Users\amir\Downloads\ABDM</span>
          <div style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3 7l3-4h12l3 4v13H3V7z" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/><path d="M3 7h18" stroke="#94a3b8" stroke-width="1.5"/></svg>
          </div>
          <div style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
        <!-- File Size -->
        <div style="width:130px;display:flex;align-items:center;gap:8px;background:#1e293b;border:1px solid #334155;border-radius:6px;height:36px;padding:0 12px;flex-shrink:0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1" fill="#3b82f6" opacity="0.3"/><rect x="14" y="3" width="7" height="7" rx="1" fill="#3b82f6" opacity="0.3"/><rect x="3" y="14" width="7" height="7" rx="1" fill="#3b82f6" opacity="0.3"/><rect x="14" y="14" width="7" height="7" rx="1" fill="#3b82f6" opacity="0.3"/></svg>
          <span style="font-size:11px;color:#e2e8f0;">363.35 KB</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>

      <!-- File Name + Actions -->
      <div style="display:flex;gap:8px;margin-bottom:14px;">
        <div style="flex:1;background:#1e293b;border:1px solid #334155;border-radius:6px;height:36px;display:flex;align-items:center;padding:0 12px;">
          <span style="font-size:11px;color:#94a3b8;">Firefox Installer.exe</span>
        </div>
        <div style="width:36px;height:36px;background:#1e293b;border:1px solid #334155;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 4v6h6M20 20v-6h-6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 9A8 8 0 0 0 5.6 5.6L4 7M4 15a8 8 0 0 0 14.4 3.4L20 17" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
        <div style="width:36px;height:36px;background:#1e293b;border:1px solid #334155;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="#94a3b8" stroke-width="1.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
      </div>

      <!-- Buttons -->
      <div style="display:flex;gap:8px;align-items:center;">
        <button style="width:100px;height:36px;background:transparent;border:1px solid #334155;border-radius:6px;font-size:12px;color:#94a3b8;cursor:pointer;">Add</button>
        <button style="width:140px;height:36px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:none;border-radius:6px;font-size:13px;color:#fff;font-weight:600;cursor:pointer;">Download</button>
        <div style="flex:1;"></div>
        <button style="width:100px;height:36px;background:transparent;border:1px solid #334155;border-radius:6px;font-size:12px;color:#94a3b8;cursor:pointer;">Cancel</button>
      </div>

    </div>
  </div>
</div>

</body>
</html>
