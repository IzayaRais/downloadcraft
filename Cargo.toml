[package]
name = "download_craft"
version = "0.9.8"
edition = "2021"
description = "Download Craft — a lightweight, offline-first download manager (egui GUI + CLI)"
license = "MIT"

[workspace]
members = [".", "crates/downloadcraft-engine"]

[dependencies]
downloadcraft-engine = { path = "crates/downloadcraft-engine", version = "0.1.0" }
eframe = "0.32"
egui = "0.32"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "5"
url = "2"
anyhow = "1"
ab_glyph = "0.2"
arboard = "3"
clap = { version = "4", features = ["derive"] }
notify-rust = "4"
rfd = "0.15"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
rustybuzz = "0.20.1"
unicode-segmentation = "1.13.3"
flate2 = "1"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.20"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
shlex = "2"
