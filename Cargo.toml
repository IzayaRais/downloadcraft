[package]
name = "download_craft"
version = "0.6.0"
edition = "2021"
description = "Download Craft — a lightweight, offline-first download manager (egui GUI + CLI)"
license = "MIT"

[dependencies]
eframe = "0.32"
egui = "0.32"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "5"
url = "2"
anyhow = "1"
arboard = "3"
clap = { version = "4", features = ["derive"] }
notify-rust = "4"
rfd = "0.15"
tray-icon = "0.20"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1"
